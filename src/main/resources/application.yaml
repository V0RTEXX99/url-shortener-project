spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: spring-boot-url-shortener
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    #hibernate:
      #ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
    show-sql: true
    open-in-view: false
  docker:
    compose:
      lifecycle-management: start_only
  security:
    user:
      name: ${SECURITY_USERNAME:user}
      password: ${SECURITY_PASSWORD:password123}
      roles:
        - USER
        - ADMIN
server:
  port: ${SERVER_PORT:8080}

## App Config
app:
  base-url: http://localhost:8081
  default-expiry-in-days: 30
  validate-original-url: true
